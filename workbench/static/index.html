<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <title>MimeKit Workbench</title>
  <style>
    body{font-family:system-ui;max-width:960px;margin:2rem auto;padding:0 1rem}
    textarea{width:100%;height:200px;font-family:monospace}
    button{margin-top:.5rem;padding:.5rem 1rem}
    pre{background:#f4f4f4;padding:1rem;overflow:auto}
  </style>
</head>
<body>
  <h1>MIME Workbench</h1>
  <p>Paste raw MIME below and parse via <code>/api/parse</code>.</p>
  <textarea id="raw" placeholder="Content-Type: text/plain..."></textarea>
  <button id="go">Parse</button>
  <pre id="out"></pre>
  <script>
    document.getElementById('go').onclick = async () => {
      const raw = document.getElementById('raw').value;
      const res = await fetch('/api/parse', {method:'POST', body: raw});
      const text = await res.text();
      document.getElementById('out').textContent = text;
    };
  </script>
</body>
</html>
